<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>לוח הפסקות — תצוגת טלוויזיה</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0a0e17;
      --surface:  #111827;
      --card:     #1a2236;
      --border:   rgba(255,255,255,0.07);
      --accent:   #0038B8;
      --accent2:  #4B85FF;
      --text:     #f0f4ff;
      --muted:    rgba(240,244,255,0.45);
      --green:    #22c55e;
      --yellow:   #eab308;
      --red:      #ef4444;
    }

    html, body {
      font-family: 'Heebo', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      font-size: 16px;
    }

    /* ── LAYOUT ── */
    .screen {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
      padding: 20px 28px 16px;
      gap: 16px;
    }

    /* ── HEADER ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .logo-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.5; transform: scale(0.85); }
    }
    .header-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .header-title span { color: var(--accent2); }
    .clock-block {
      text-align: center;
    }
    .clock {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 0.04em;
      font-feature-settings: "tnum";
      color: var(--text);
      line-height: 1;
    }
    .date-str {
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
      margin-top: 2px;
      direction: ltr;
    }
    .sync-badge {
      font-size: 12px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 20px;
      background: rgba(34,197,94,0.12);
      color: var(--green);
      border: 1px solid rgba(34,197,94,0.25);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sync-badge.error {
      background: rgba(239,68,68,0.12);
      color: var(--red);
      border-color: rgba(239,68,68,0.25);
    }
    .sync-badge.loading {
      background: rgba(234,179,8,0.12);
      color: var(--yellow);
      border-color: rgba(234,179,8,0.25);
    }

    /* ── SHIFTS ── */
    .shifts-wrapper {
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 14px;
      overflow: hidden;
    }
    .shift-block {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
    }
    .shift-label {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      border-inline-start: 3px solid var(--accent);
      padding-inline-start: 10px;
    }
    .slots-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      flex: 1;
    }
    .shift-block:last-child .slots-row {
      grid-template-columns: repeat(2, 1fr);
    }

    /* ── SLOT CARD ── */
    .slot-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s;
    }
    .slot-card::before {
      content: '';
      position: absolute;
      top: 0; inset-inline-start: 0;
      width: 3px; height: 100%;
      background: var(--accent);
      border-radius: 0 0 0 12px;
    }
    .slot-card.active::before { background: var(--green); box-shadow: 0 0 10px var(--green); }
    .slot-card.full::before   { background: var(--red); }
    .slot-card.active { border-color: rgba(34,197,94,0.25); }

    .slot-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .slot-time {
      font-size: 18px;
      font-weight: 900;
      color: var(--accent2);
      direction: ltr;
      letter-spacing: 0.01em;
    }
    .slot-card.active .slot-time { color: var(--green); }
    .slot-status {
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 10px;
      letter-spacing: 0.05em;
    }
    .status-active  { background: rgba(34,197,94,0.15);  color: var(--green); }
    .status-open    { background: rgba(75,133,255,0.12); color: var(--accent2); }
    .status-full    { background: rgba(239,68,68,0.12);  color: var(--red); }
    .status-done    { background: rgba(255,255,255,0.06); color: var(--muted); }

    /* Agent names */
    .agents-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .agent-row {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      background: rgba(255,255,255,0.04);
      border-radius: 6px;
      padding: 5px 10px;
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .agent-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent2);
      flex-shrink: 0;
    }
    .slot-card.active .agent-dot { background: var(--green); }
    .empty-slot {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
      border: 1px dashed rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 10px;
    }

    /* Cap bar */
    .cap-bar {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .cap-pip {
      height: 4px;
      flex: 1;
      border-radius: 2px;
      background: rgba(255,255,255,0.1);
      transition: background 0.4s;
    }
    .cap-pip.filled       { background: var(--accent2); }
    .slot-card.active .cap-pip.filled { background: var(--green); }
    .slot-card.full   .cap-pip.filled { background: var(--red); }

    /* ── FOOTER ── */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }
    .footer-left { display: flex; gap: 20px; }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .legend-dot  { width: 8px; height: 8px; border-radius: 50%; }

    /* Active slot highlight */
    .slot-card.active {
      background: #0f1f12;
    }
  </style>
</head>
<body>
<div class="screen">

  <!-- HEADER -->
  <div class="header">
    <div class="header-right">
      <div class="logo-dot"></div>
      <div class="header-title">לוח <span>הפסקות</span> צהריים</div>
    </div>
    <div class="clock-block">
      <div class="clock" id="clock">--:--:--</div>
      <div class="date-str" id="date-str"></div>
    </div>
    <div id="sync-badge" class="sync-badge loading">⟳ מתחבר...</div>
  </div>

  <!-- SHIFTS -->
  <div class="shifts-wrapper">
    <!-- MORNING -->
    <div class="shift-block">
      <div class="shift-label">משמרת בוקר</div>
      <div class="slots-row" id="grid-morning"></div>
    </div>
    <!-- AFTERNOON -->
    <div class="shift-block">
      <div class="shift-label">משמרת ערב</div>
      <div class="slots-row" id="grid-afternoon"></div>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <div class="footer-left">
      <span class="legend-item"><span class="legend-dot" style="background:var(--green)"></span> פעיל עכשיו</span>
      <span class="legend-item"><span class="legend-dot" style="background:var(--accent2)"></span> פתוח</span>
      <span class="legend-item"><span class="legend-dot" style="background:var(--red)"></span> מלא</span>
      <span class="legend-item"><span class="legend-dot" style="background:rgba(255,255,255,0.2)"></span> הסתיים</span>
    </div>
    <div id="last-update">טרם עודכן</div>
  </div>

</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyVR6qpUIQUVdCjJCMkMCCWDRIBbdf1D2qQbsEgXmfmnEBr4hK_tnYI0_wDhJDrAXpmxg/exec';
const POLL_MS    = 10000;

const SLOTS = [
  { id:'A', time:'11:50–12:30', maxAgents:3, shift:'morning'   },
  { id:'B', time:'12:40–13:20', maxAgents:3, shift:'morning'   },
  { id:'C', time:'13:30–14:10', maxAgents:3, shift:'morning'   },
  { id:'D', time:'14:10–14:50', maxAgents:3, shift:'morning'   },
  { id:'E', time:'15:00–15:40', maxAgents:1, shift:'afternoon' },
  { id:'F', time:'16:00–16:40', maxAgents:1, shift:'afternoon' },
];

// Parse "HH:MM" → minutes since midnight
function toMin(t) {
  const [h,m] = t.split(':').map(Number);
  return h * 60 + m;
}
function slotStatus(timeRange) {
  const now  = new Date();
  const cur  = now.getHours() * 60 + now.getMinutes();
  const [s,e] = timeRange.split('–');
  const start = toMin(s), end = toMin(e);
  if (cur >= start && cur < end) return 'active';
  if (cur < start)               return 'open';
  return 'done';
}

let state = {};

function render() {
  const now = new Date();

  ['morning','afternoon'].forEach(shift => {
    const grid = document.getElementById(`grid-${shift}`);
    grid.innerHTML = '';

    SLOTS.filter(s => s.shift === shift).forEach(slot => {
      const agents  = state[slot.id] || [];
      const isFull  = agents.length >= slot.maxAgents;
      const status  = slotStatus(slot.time);

      const card = document.createElement('div');
      card.className = 'slot-card' +
        (status === 'active' ? ' active' : '') +
        (isFull              ? ' full'   : '');

      // Top row: time + status badge
      const top = document.createElement('div');
      top.className = 'slot-top';

      const timeEl = document.createElement('div');
      timeEl.className = 'slot-time';
      timeEl.innerHTML = `<bdi>${slot.time}</bdi>`;

      const badge = document.createElement('span');
      badge.className = 'slot-status ';
      if (status === 'active') {
        badge.className += 'status-active';
        badge.textContent = '● פעיל';
      } else if (status === 'done') {
        badge.className += 'status-done';
        badge.textContent = 'הסתיים';
      } else if (isFull) {
        badge.className += 'status-full';
        badge.textContent = 'מלא';
      } else {
        badge.className += 'status-open';
        badge.textContent = `${slot.maxAgents - agents.length} פנוי`;
      }

      top.appendChild(timeEl);
      top.appendChild(badge);
      card.appendChild(top);

      // Capacity pips
      const capBar = document.createElement('div');
      capBar.className = 'cap-bar';
      for (let i = 0; i < slot.maxAgents; i++) {
        const pip = document.createElement('div');
        pip.className = 'cap-pip' + (i < agents.length ? ' filled' : '');
        capBar.appendChild(pip);
      }
      card.appendChild(capBar);

      // Agents
      const area = document.createElement('div');
      area.className = 'agents-area';

      if (agents.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-slot';
        empty.textContent = status === 'done' ? '—' : 'אין רשומים עדיין';
        area.appendChild(empty);
      } else {
        agents.forEach(name => {
          const row = document.createElement('div');
          row.className = 'agent-row';
          const dot = document.createElement('span');
          dot.className = 'agent-dot';
          row.appendChild(dot);
          row.appendChild(document.createTextNode(name));
          area.appendChild(row);
        });
        // Empty slots for remaining capacity
        for (let i = agents.length; i < slot.maxAgents; i++) {
          const row = document.createElement('div');
          row.className = 'agent-row';
          row.style.opacity = '0.3';
          row.style.fontWeight = '400';
          row.style.fontSize = '13px';
          row.style.color = 'var(--muted)';
          row.textContent = 'פנוי';
          area.appendChild(row);
        }
      }

      card.appendChild(area);
      grid.appendChild(card);
    });
  });
}

// Clock
function updateClock() {
  const n = new Date();
  const pad = x => String(x).padStart(2,'0');
  document.getElementById('clock').textContent =
    `${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;

  const days = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  const months = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני',
                  'יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  document.getElementById('date-str').textContent =
    `יום ${days[n.getDay()]}, ${n.getDate()} ב${months[n.getMonth()]} ${n.getFullYear()}`;
}
setInterval(updateClock, 1000);
updateClock();

// Fetch
async function fetchState() {
  const badge = document.getElementById('sync-badge');
  try {
    badge.className = 'sync-badge loading';
    badge.textContent = '⟳ מסנכרן...';
    const res  = await fetch(SCRIPT_URL + '?t=' + Date.now(), { cache:'no-store' });
    const data = await res.json();
    if (data.ok) {
      state = data.state;
      render();
      badge.className = 'sync-badge';
      badge.textContent = '✓ מעודכן';
      const now = new Date();
      document.getElementById('last-update').textContent =
        `עדכון אחרון: ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
    } else {
      throw new Error('not ok');
    }
  } catch(e) {
    badge.className = 'sync-badge error';
    badge.textContent = '✗ אין חיבור';
  }
}

fetchState();
setInterval(fetchState, POLL_MS);
// Re-render every minute to update active/done status
setInterval(render, 60000);
</script>
</body>
</html>
